<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#home">
            Solar System Explorer
            </a>
            <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
            aria-controls="navbarMenu"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="#home">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#solar-system">Explore</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#planets">Planets</a>
                </li>

            </ul>
        </div>
        </div>
    </nav>
    <section id="home" class="container text-center py-5">
        <h1>Explore our solar system</h1>
        <p>Discover the planets that orbit our Sun.</p>
    </section>
    <section id="solar-system" class="container text-center py-5">
        <h2>Our Solar System</h2>
        
<div class="solar-body">

    <!-- Mercury's fixed orbit -->
    <div class="orbit mercury-track"></div>

    <!-- Rotating container for Mercury -->
    <div class="mercury-orbit">
        <div class="mercury"></div>
    </div>

    
<!-- Venus's fixed orbit -->
<div class="orbit venus-track"></div>

<!-- Rotating container for Venus -->
<div class="venus-orbit">
    <div class="venus"></div>
</div>

<!-- Earth's fixed orbit -->
<div class="orbit earth-track"></div>

<!-- Rotating container for Earth -->
<div class="earth-orbit">
    <div class="earth"></div>
</div>


<!-- Mars's fixed orbit -->
<div class="orbit mars-track"></div>

<!-- Rotating container for Mars -->
<div class="mars-orbit">
    <div class="mars"></div>
</div>



    <!-- Sun -->
    <div class="sun">
        <div class="sun-core"></div>
    </div>

</div>



</div>
    </section>
    <section id="planets" class="container text-center py-5">
        <h2>Meet the planets</h2>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" defer></script>

</body>
</html>
